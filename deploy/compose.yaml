# The shop on one server (#56): the same file for production and staging.
# Each environment is its own checkout of this repository with its own
# settings next to this file (docs/operations/runbook.md):
#   deploy/.env        SHOP_ENVIRONMENT, DB_PASSWORD, WEB_PORT (compose.env.example)
#   deploy/app.env     the shop's settings (.env.example), web and worker
#   deploy/backup.env  backup settings and off-site credentials (backup.env.example)
# deploy/deploy.sh pulls the images of one commit, backs up, migrates and
# then starts that version; run it rather than `docker compose up` by hand.
name: auto-shop-${SHOP_ENVIRONMENT:?Set SHOP_ENVIRONMENT in deploy/.env}

x-database-url: &database-url postgresql://auto:${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}@db:5432/auto

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auto
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auto", "-d", "auto"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the containers below reach the database.

  web:
    image: ${WEB_IMAGE:?Run deploy/deploy.sh, which sets WEB_IMAGE}
    restart: unless-stopped
    env_file: app.env
    environment:
      DATABASE_URL: *database-url
      APP_ENV: ${SHOP_ENVIRONMENT}
      APP_RELEASE: ${SHOP_RELEASE:-}
    depends_on:
      db:
        condition: service_healthy
    # Only the reverse proxy on this server (deploy/proxy) reaches the app.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  worker:
    image: ${TASKS_IMAGE:?Run deploy/deploy.sh, which sets TASKS_IMAGE}
    restart: unless-stopped
    env_file: app.env
    environment:
      DATABASE_URL: *database-url
      APP_ENV: ${SHOP_ENVIRONMENT}
      APP_RELEASE: ${SHOP_RELEASE:-}
    depends_on:
      db:
        condition: service_healthy
    # SIGTERM lets the running job finish.
    stop_grace_period: 2m

  backup:
    image: ${TASKS_IMAGE}
    restart: unless-stopped
    command: ["scripts/backup-schedule.sh"]
    env_file: backup.env
    environment:
      DATABASE_URL: *database-url
      RESTORE_SERVER_URL: postgresql://auto:${DB_PASSWORD}@db:5432/postgres
      BACKUP_DIR: /backups
      APP_ENV: ${SHOP_ENVIRONMENT}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # A backup or restore check in progress is allowed to finish.
    stop_grace_period: 10m

  # One-off tasks: deploy.sh runs migrations before starting a new version.
  migrate:
    profiles: [tasks]
    image: ${TASKS_IMAGE}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
  backups:
