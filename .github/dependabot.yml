version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    ignore:
      # Types follow the Node.js runtime in .nvmrc; bump deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The lint config must match the framework version, including majors.
      nextjs:
        patterns: ["next", "eslint-config-next"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
