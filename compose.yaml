services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
      POSTGRES_DB: auto
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auto_database:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  auto_database:
